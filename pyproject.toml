[project]
name = "cv-matcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "froesws", email = "froes.ws@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.14.3",
    "reportlab>=5.1.0",
    "specify>=0.0.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
files = ["backend/src"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
